<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slime Math Challenge - Ad Deluxe</title>
    <style>
        body { 
            margin: 0; height: 100vh; display: flex; flex-direction: column; 
            background: #e3f2fd; font-family: 'Arial', sans-serif; overflow: hidden; touch-action: none; position: fixed; width: 100%;
        }
        
        /* 上下の広告枠：110px */
        #ad-top, #ad-bottom { 
            width: 100%; height: 110px; background: #333; 
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 100;
        }
        iframe { border: none; width: 100%; height: 100%; }

        /* ゲームエリア */
        #game-area { 
            flex-grow: 1; position: relative; width: 100%; background: #bbdefb; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        #score-ui { position: absolute; top: 10px; right: 20px; font-size: 20px; font-weight: bold; color: #1565c0; }
        #question { font-size: 48px; font-weight: bold; color: #1565c0; margin-bottom: 20px; }
        #timer-bar { width: 80%; height: 10px; background: #e3f2fd; border-radius: 5px; margin-bottom: 30px; overflow: hidden; }
        #timer-fill { width: 100%; height: 100%; background: #f44336; }
        
        #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 90%; max-width: 400px; }
        .choice-btn { padding: 20px; font-size: 24px; background: #ffffff; border: 3px solid #1565c0; border-radius: 15px; color: #1565c0; font-weight: bold; cursor: pointer; text-align: center; -webkit-tap-highlight-color: transparent; }
        .choice-btn:active { background: #1565c0; color: white; }

        /* メニュー（ゲームオーバー）画面 */
        #menuScreen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.95); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 200; padding: 15px 0; box-sizing: border-box;
        }

        /* 320x100のスリム広告コンテナ */
        #ad-middle-container { 
            width: 320px; height: 100px; background: #eee;
            display: none; justify-content: center; align-items: center; 
            overflow: hidden; flex-shrink: 0; border: 1px solid #ccc; margin: 15px 0;
        }

        /* 大広告（全画面） */
        #bigAdScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000;
            display: none; justify-content: center; align-items: center;
        }
        .ad-frame-wrapper { width: 90%; height: 80%; position: relative; }
        .ad-close-btn { 
            position: absolute; top: -10px; right: -10px; color: white; font-size: 30px; 
            font-weight: bold; cursor: pointer; background: rgba(0,0,0,0.5); 
            width: 40px; height: 40px; border-radius: 50%; display: none;
            align-items: center; justify-content: center; z-index: 2100;
        }
        
        .btn-group { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
        .menu-btn { padding: 14px 30px; font-size: 18px; border: none; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; text-decoration: none; width: 240px; text-align: center; transition: 0.3s; }
        #goButton { background: #1e88e5; box-shadow: 0 4px #1565c0; }
        #goButton:disabled { background: #999; box-shadow: 0 4px #666; cursor: default; }
        .link-btn { background: #ff4081; box-shadow: 0 4px #c2185b; }
        .best-info { color: #1565c0; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ad-top"><iframe src="ad.html" id="frame-top"></iframe></div>

    <div id="game-area">
        <div id="score-ui">SCORE: 0</div>
        <div id="question">? + ?</div>
        <div id="timer-bar"><div id="timer-fill"></div></div>
        <div id="choices">
            <div class="choice-btn" onclick="checkAnswer(this)">0</div>
            <div class="choice-btn" onclick="checkAnswer(this)">0</div>
            <div class="choice-btn" onclick="checkAnswer(this)">0</div>
            <div class="choice-btn" onclick="checkAnswer(this)">0</div>
        </div>

        <div id="menuScreen">
            <div style="text-align:center;">
                <h1 id="menuTitle" style="color:#1e88e5; margin:0; font-size: 28px;">SLIME MATH</h1>
                <p id="menuMsg" style="margin:5px 0; font-size:16px;">5秒以内に解けるかな？⚡</p>
                <div class="best-info">BEST SCORE: <span id="best-ui">0</span></div>
            </div>

            <div id="ad-middle-container">
                <div id="im-8b988d7b042a42d5b8df6921b628cf00">
                    <script async src="https://imp-adedge.i-mobile.co.jp/script/v1/spot.js?20220104"></script>
                    <script>(window.adsbyimobile=window.adsbyimobile||[]).push({pid:84561,mid:590804,asid:1924211,type:"banner",display:"inline",elementid:"im-8b988d7b042a42d5b8df6921b628cf00"})</script>
                </div>
            </div>

            <div class="btn-group">
                <button id="goButton" class="menu-btn" onclick="startNewGame()">GAME START</button>
                <a href="https://saaaachi.github.io/" class="menu-btn link-btn">他のゲームはこちら</a>
            </div>
        </div>

        <div id="bigAdScreen">
            <div class="ad-frame-wrapper">
                <div id="ad-close-btn" class="ad-close-btn" onclick="closeAd()">×</div>
                <iframe id="ad-large-frame" src="" style="width:100%; height:100%; border:none;"></iframe>
            </div>
        </div>
    </div>

    <div id="ad-bottom"><iframe src="ad.html" id="frame-bottom"></iframe></div>

    <script>
        let score = 0, correctAnswer = 0, timeLeft = 100, timerInterval, gameActive = false, playCount = 0;
        let bestScore = localStorage.getItem("slime_math_challenge_best") || 0;

        const questionEl = document.getElementById('question'),
              scoreEl = document.getElementById('score-ui'),
              timerFill = document.getElementById('timer-fill'),
              menuScreen = document.getElementById('menuScreen'),
              menuTitle = document.getElementById('menuTitle'),
              menuMsg = document.getElementById('menuMsg'),
              bestUi = document.getElementById('best-ui'),
              goButton = document.getElementById('goButton'),
              adMid = document.getElementById('ad-middle-container'),
              choiceBtns = document.querySelectorAll('.choice-btn');

        window.onload = () => { 
            bestUi.innerText = bestScore; 
            adMid.style.display = "none"; // スタート時は非表示
        };

        function startNewGame() {
            menuScreen.style.display = 'none';
            adMid.style.display = 'none';
            gameActive = true;
            score = 0;
            nextQuestion();
        }

        function nextQuestion() {
            if(!gameActive) return;
            scoreEl.innerText = `SCORE: ${score}`;
            let maxNum = 10 + Math.floor(score / 5) * 5;
            let a = Math.floor(Math.random() * maxNum) + 1;
            let b = Math.floor(Math.random() * maxNum) + 1;
            let isSub = Math.random() > 0.5;

            if (isSub) {
                if (a < b) [a, b] = [b, a];
                questionEl.innerText = `${a} - ${b}`;
                correctAnswer = a - b;
            } else {
                questionEl.innerText = `${a} + ${b}`;
                correctAnswer = a + b;
            }

            let answers = [correctAnswer];
            while(answers.length < 4) {
                let wrong = correctAnswer + (Math.floor(Math.random() * 11) - 5);
                if (wrong >= 0 && !answers.includes(wrong)) answers.push(wrong);
            }
            answers.sort(() => Math.random() - 0.5);
            choiceBtns.forEach((btn, i) => { btn.innerText = answers[i]; });

            clearInterval(timerInterval);
            timeLeft = 100;
            timerInterval = setInterval(() => {
                timeLeft -= 2; // Challengeは1回2%減（5秒）
                timerFill.style.width = timeLeft + "%";
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameOver("TIME UP!");
                }
            }, 100);
        }

        function checkAnswer(btn) {
            if(!gameActive) return;
            if (parseInt(btn.innerText) === correctAnswer) {
                score++;
                nextQuestion();
            } else {
                gameOver("WRONG!");
            }
        }

        function gameOver(msg) {
            gameActive = false;
            playCount++;
            clearInterval(timerInterval);

            if(score > bestScore) {
                bestScore = score;
                localStorage.setItem("slime_math_challenge_best", bestScore);
                bestUi.innerText = bestScore;
            }

            menuTitle.innerText = msg;
            menuTitle.style.color = "#f44336";
            menuMsg.innerText = "SCORE: " + score;
            
            // ボタン待機状態
            goButton.innerText = "お待ちください...";
            goButton.disabled = true;
            adMid.style.display = "flex"; // ゲームオーバー時のみ表示
            menuScreen.style.display = "flex";

            // 大広告判定（3回目、以降7回おき）
            if (playCount === 3 || (playCount > 3 && (playCount - 3) % 7 === 0)) {
                setTimeout(showBigAd, 400);
            } else {
                setTimeout(() => {
                    goButton.disabled = false;
                    goButton.innerText = "RETRY";
                }, 1500);
            }
        }

        function showBigAd() {
            const screen = document.getElementById("bigAdScreen");
            const closeBtn = document.getElementById("ad-close-btn");
            const frame = document.getElementById("ad-large-frame");
            frame.src = "ad.large.html?t=" + Date.now();
            screen.style.display = "flex";
            closeBtn.style.display = "none";
            setTimeout(() => { closeBtn.style.display = "flex"; }, 5000);
        }

        function closeAd() {
            document.getElementById("bigAdScreen").style.display = "none";
            document.getElementById("ad-large-frame").src = "";
            goButton.disabled = false;
            goButton.innerText = "RETRY";
        }
    </script>
</body>
</html>
